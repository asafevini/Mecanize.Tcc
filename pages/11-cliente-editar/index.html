<!DOCTYPE html>
<html lang="pt-BR" data-base="../../" data-active="clientes">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mecanize · Editar Cliente</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="../../assets/css/sidebar.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <div data-component="sidebar"></div>
    <div class="main">
      <div data-component="topbar"></div>

      <main class="content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Editar Cliente</h1>
            <p class="page-header__subtitle">Atualize as informações do cliente no sistema.</p>
          </div>
        </div>

        <div class="grid-2">
          <section class="card">
            <div class="card__header"><div class="card__title">1. Informações Pessoais</div></div>
            <div class="card__body">
              <div class="form-field"><label>Nome Completo</label><input type="text" value="João Pedro da Silva" /></div>
              <div class="form-field mt-12"><label>CPF/CNPJ</label><input type="text" value="123.456.789-09" /></div>
              <div class="form-field mt-12"><label>Data de Nascimento</label><input type="text" value="15/04/1985" /></div>
            </div>
          </section>

          <section class="card">
            <div class="card__header"><div class="card__title">2. Contato</div></div>
            <div class="card__body">
              <div class="form-field"><label>E-mail</label><input type="email" value="joaopedro.silva@email.com" /></div>
              <div class="form-row mt-12">
                <div class="form-field"><label>Telefone</label><input type="text" value="(11) 98765-4321" /></div>
                <div class="form-field"><label>WhatsApp</label><input type="text" value="(11) 91234-5678" /></div>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card__header"><div class="card__title">3. Endereço</div></div>
            <div class="card__body">
              <div class="form-row">
                <div class="form-field" style="flex: 3;"><label>Rua</label><input type="text" value="Rua das Flores" /></div>
                <div class="form-field" style="flex: 1;"><label>Número</label><input type="text" value="250" /></div>
              </div>
              <div class="form-row mt-12">
                <div class="form-field"><label>Bairro</label><input type="text" value="Jardim das Palmeiras" /></div>
                <div class="form-field"><label>CEP</label><input type="text" value="01453-000" /></div>
              </div>
              <div class="form-row mt-12">
                <div class="form-field"><label>Cidade</label><input type="text" value="São Paulo" /></div>
                <div class="form-field"><label>Estado</label><input type="text" value="SP" /></div>
              </div>
            </div>
          </section>

          <section class="card">
            <div class="card__header">
              <div class="card__title">4. Veículos Associados</div>
              <button class="btn btn--primary btn--sm">+ Adicionar Veículo</button>
            </div>
            <div class="card__body">
              <div class="vehicle-card">
                <div class="vehicle-card__icon"><i data-icon="car" data-size="18"></i></div>
                <div>
                  <div class="fw-600">Honda Civic EXL 2.0</div>
                  <div class="text-muted fs-12">ABC-4D56 · Prata</div>
                </div>
                <button class="row-action-btn" style="margin-left:auto;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
              </div>
              <div class="vehicle-card">
                <div class="vehicle-card__icon"><i data-icon="car" data-size="18"></i></div>
                <div>
                  <div class="fw-600">Toyota Yaris SRX 2.8</div>
                  <div class="text-muted fs-12">DEF-7G89 · Preto</div>
                </div>
                <button class="row-action-btn" style="margin-left:auto;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
              </div>
              <div class="vehicle-card">
                <div class="vehicle-card__icon"><i data-icon="car" data-size="18"></i></div>
                <div>
                  <div class="fw-600">Ford Fiesta SE 1.6</div>
                  <div class="text-muted fs-12">GHI-1J23 · Branco</div>
                </div>
                <button class="row-action-btn" style="margin-left:auto;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
              </div>
            </div>
          </section>
        </div>

        <div class="page-footer mt-24">
          <div class="flex gap-12">
            <button class="btn btn--primary"><i data-icon="save" data-size="14"></i> Salvar Alterações</button>
            <a href="../12-cliente-visualizar/index.html" class="btn btn--ghost"><i data-icon="x" data-size="14"></i> Cancelar</a>
          </div>
          <button class="btn btn--danger-ghost"><i data-icon="ban" data-size="14"></i> Desativar Cliente</button>
        </div>
      </main>
    </div>
  </div>
  <script src="../../assets/js/loadComponents.js" defer></script>
</body>
</html>
