<!DOCTYPE html>
<html lang="pt-BR" data-base="../../" data-active="produtos">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mecanize · Editar Produto</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="../../assets/css/sidebar.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <div data-component="sidebar"></div>
    <div class="main">
      <div data-component="topbar"></div>

      <main class="content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Editar Produto</h1>
            <p class="page-header__subtitle">Atualize as informações do produto no sistema.</p>
          </div>
        </div>

        <div class="grid-2">
          <section class="card">
            <div class="card__header"><div class="card__title">1. Informações Básicas</div></div>
            <div class="card__body">
              <div class="form-field"><label>Nome do Produto</label><input type="text" value="Óleo Lubrificante 5W30 Sintético" /></div>
              <div class="form-field mt-12"><label>SKU</label><input type="text" value="OLE-5W30" /></div>
              <div class="form-field mt-12"><label>Categoria</label><select><option>Lubrificantes</option><option>Óleos</option></select></div>
            </div>
          </section>

          <section class="card">
            <div class="card__header"><div class="card__title">2. Estoque e Preço</div></div>
            <div class="card__body">
              <div class="form-row">
                <div class="form-field"><label>Estoque</label><input type="number" value="48" /></div>
                <div class="form-field"><label>Preço de Custo</label><input type="text" value="R$ 69,90" /></div>
              </div>
              <div class="form-row mt-12">
                <div class="form-field"><label>Preço de Venda</label><input type="text" value="R$ 89,90" /></div>
                <div class="form-field"><label>Margem de Lucro</label><input type="text" value="28,60%" /></div>
              </div>
            </div>
          </section>

          <section class="card" style="grid-column: 1/-1;">
            <div class="card__header"><div class="card__title">3. Descrição</div></div>
            <div class="card__body">
              <div class="form-field"><textarea rows="4" placeholder="Digite a descrição do produto..."></textarea></div>
            </div>
          </section>
        </div>

        <div class="page-footer mt-24">
          <div class="flex gap-12">
            <button class="btn btn--primary"><i data-icon="save" data-size="14"></i> Salvar Alterações</button>
            <a href="../17-produto-visualizar/index.html" class="btn btn--ghost"><i data-icon="x" data-size="14"></i> Cancelar</a>
          </div>
          <button class="btn btn--danger-ghost"><i data-icon="trash" data-size="14"></i> Excluir</button>
        </div>
      </main>
    </div>
  </div>
  <script src="../../assets/js/loadComponents.js" defer></script>
</body>
</html>
